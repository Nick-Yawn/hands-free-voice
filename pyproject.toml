[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hands-free-voice"
version = "0.1.2"
description = "Hands-free voice for Claude Code: the audio half of the hands-free-voice mod, and a standalone voice front end."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Nicholas Yuan" }]
keywords = ["claude", "claude-code", "voice", "speech", "stt", "tts"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "sounddevice>=0.5",
    "websockets>=13",
    "webrtcvad-wheels>=2.0.14",
]

[project.urls]
Homepage = "https://github.com/Nick-Yawn/hands-free-voice"
Issues = "https://github.com/Nick-Yawn/hands-free-voice/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hands-free-voice = "hands_free_voice.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["hands_free_voice"]

[tool.hatch.build.targets.sdist]
include = ["/hands_free_voice", "/tests", "/plugin", "/README.md", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
